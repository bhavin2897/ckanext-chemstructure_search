<button
  type="button"
  class="structure-search-small-button"
  data-toggle="modal"
  data-target="#chemstructure-home-modal">
  <i class="fa fa-atom"></i>
  <span>Structure search</span>
</button>

<hr>

<div
  class="modal fade chemstructure-modal"
  id="chemstructure-home-modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="chemstructure-home-modal-title">

  <div class="modal-dialog chemstructure-modal-dialog" role="document">
    <div class="modal-content">

      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>

        <h4 class="modal-title" id="chemstructure-home-modal-title">
          Structure search
        </h4>
      </div>

      <div class="modal-body">

        <p class="text-muted">
          Draw a molecule
        </p>

        <iframe
          id="ketcher-frame"
          src="/chemstructure_search/ketcher/index.html"
          class="chemstructure-modal-ketcher-frame">
        </iframe>

        <div class="form-group chemstructure-modal-query">
          <label for="chemstructure-smiles">SMILES / SMARTS query</label>
          <input
            id="chemstructure-smiles"
            class="form-control"
            type="text"
            placeholder="Draw a structure or paste a SMILES/SMARTS query">
              </div>

      <div class="chemstructure-search-mode" role="radiogroup" aria-label="Search type">
        <label class="chemstructure-radio-option">
          <input
            type="radio"
            class="chemstructure-search-mode-input"
            value="exact">
          <span>Exact</span>
        </label>

        <label class="chemstructure-radio-option">
          <input
            type="radio"
            class="chemstructure-search-mode-input"
            value="similarity"
            checked>
          <span>Similarity</span>
        </label>

        <label class="chemstructure-radio-option">
          <input
            type="radio"
            class="chemstructure-search-mode-input"
            value="substructure">
          <span>Substructure</span>
        </label>
      </div>

      <div id="chemstructure-threshold-wrapper" class="chemstructure-threshold-wrapper">
    <label for="chemstructure-threshold" class="chemstructure-threshold-label">
        Similarity threshold:
        <strong id="chemstructure-threshold-value">0.25</strong>
      </label>

      <input
        id="chemstructure-threshold"
        class="chemstructure-threshold-slider"
        type="range"
        min="0.05"
        max="1.00"
        step="0.05"
        value="0.25">

        <div class="chemstructure-threshold-help">
          Lower values return broader results. Higher values return stricter matches.
        </div>
    </div>

      <div class="chemstructure-actions">
        <button
          id="chemstructure-clear"
          type="button"
          class="btn btn-link">
          Clear
        </button>
        <button
          id="chemstructure-search"
          type="button"
          class="btn btn-primary chemstructure-search-right">
          Search
        </button>
      </div>

        <div id="chemstructure-message" class="chemstructure-message"></div>

        <div
          id="chemstructure-search-loading"
          class="chemstructure-search-loading"
          role="status"
          aria-live="polite"
          aria-hidden="true"
          hidden>
          <div class="chemstructure-loading-panel">
            <div class="chemstructure-loading-heading">
              <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
              <div>
                <strong>Searching molecule structures&hellip;</strong>
                <span>This may take a moment.</span>
              </div>
            </div>

            <div class="chemstructure-loading-results" aria-hidden="true">
              {% for row in range(3) %}
                <div class="chemstructure-loading-result">
                  <div class="chemstructure-loading-molecule"></div>
                  <div class="chemstructure-loading-copy">
                    <div class="chemstructure-loading-line chemstructure-loading-line-title"></div>
                    <div class="chemstructure-loading-line"></div>
                    <div class="chemstructure-loading-line chemstructure-loading-line-short"></div>
                  </div>
                </div>
              {% endfor %}
            </div>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">
          Close
        </button>
      </div>

    </div>
  </div>
</div>

<style>
  .search-tweaks-advanced-search {
    --molecule-search-primary: #206B82;
  }

  .search-options-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 18px;
  }

  .advanced-search-widget .another,
  .structure-search-small-button {
    color: #fff;
    background-color: var(--molecule-search-primary);
    border-color: var(--molecule-search-primary);
  }

  .advanced-search-widget .another:hover,
  .structure-search-small-button:hover {
    color: #fff;
    filter: brightness(0.9);
  }

  .advanced-search-widget .another:focus,
  .structure-search-small-button:focus {
    color: #fff;
    outline: 2px solid #fff;
    outline-offset: -4px;
    box-shadow: 0 0 0 2px var(--molecule-search-primary);
  }

  .advanced-search-widget .another:disabled,
  .structure-search-small-button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    filter: none;
  }

  .advanced-toggles {
    display: flex;
    align-items: center;
  }

  .structure-search-inline {
    order: -1;
    display: flex;
    align-items: center;
  }

  .structure-search-small-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 10px;
    border: 1px solid var(--molecule-search-primary);
    border-radius: 4px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;
    box-shadow: none;
    cursor: pointer;
  }

  .structure-search-small-button .fa {
    font-size: 13px;
  }

  .chemstructure-modal-dialog {
    width: 90%;
    max-width: 1200px;
  }

  .chemstructure-modal .modal-body {
    position: relative;
    min-height: 590px;
    overflow: hidden;
  }

  .chemstructure-modal-ketcher-frame {
    width: 100%;
    height: 430px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }

  .chemstructure-modal-query {
    margin-top: 16px;
  }

  .chemstructure-search-mode {
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: 4px;
    margin-top: 14px;
    margin-bottom: 12px;
    background: #f6f7f8;
    border-radius: 5px;
  }

  .chemstructure-search-mode label::after,
  .chemstructure-radio-option::after,
  .chemstructure-search-mode-title::after,
  .chemstructure-threshold-label::after,
  .chemstructure-threshold-wrapper label::after {
    content: none !important;
  }

  .chemstructure-radio-option {
    position: relative;
    display: flex;
    flex: 1 1 0;
    align-items: center;
    justify-content: center;
    margin: 0;
    font-weight: 400;
    cursor: pointer;
  }

  .chemstructure-radio-option input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .chemstructure-radio-option span {
    width: 100%;
    padding: 7px 12px;
    border: 1px solid transparent;
    border-radius: 4px;
    color: #4f5965;
    text-align: center;
    font-size: 13px;
    line-height: 1.2;
    transition: background-color 140ms ease, border-color 140ms ease,
      box-shadow 140ms ease, color 140ms ease;
  }

  .chemstructure-radio-option input:checked + span {
    color: #222;
    background: #fff;
    border-color: #e3e6e8;
    box-shadow: 0 1px 3px rgba(25, 40, 45, 0.1);
  }

  .chemstructure-radio-option input:focus + span {
    outline: 2px solid #1f9aaa;
    outline-offset: 1px;
  }

  .chemstructure-radio-option:hover span {
    color: #1f7783;
  }

  #chemstructure-threshold-wrapper {
  display: none;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  margin-bottom: 12px;
  width: auto;
}

  #chemstructure-threshold-wrapper .chemstructure-threshold-label {
  margin: 0;
  font-weight: 600;
  white-space: nowrap;
}

  #chemstructure-threshold-wrapper #chemstructure-threshold {
  width: 25% !important;
  max-width: 180px !important;
  min-width: 120px !important;
  flex: 0 0 auto;
}

  #chemstructure-threshold-wrapper .chemstructure-threshold-help {
  margin: 0;
  color: #777;
  font-size: 12px;
}
  .chemstructure-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    width: 100%;
    margin-top: 12px;
    margin-bottom: 12px;
  }

  .chemstructure-actions .btn {
    min-width: 76px;
    padding: 5px 13px;
    font-size: 13px;
    line-height: 1.4;
  }

  .chemstructure-modal .modal-footer .btn {
    min-width: 70px;
    padding: 5px 13px;
    font-size: 13px;
    line-height: 1.4;
  }

  .chemstructure-message {
    margin-top: 12px;
  }

  .chemstructure-search-loading[hidden] {
    display: none !important;
  }

  .chemstructure-search-loading {
    position: absolute;
    z-index: 10;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 28px 32px;
    background: #fff;
    animation: chemstructure-loading-enter 180ms ease-out both;
  }

  .chemstructure-loading-panel {
    width: 100%;
    max-width: 900px;
    padding-top: 12px;
  }

  .chemstructure-loading-heading {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
    color: #1f6670;
  }

  .chemstructure-loading-heading .fa {
    font-size: 26px;
  }

  .chemstructure-loading-heading strong,
  .chemstructure-loading-heading span {
    display: block;
  }

  .chemstructure-loading-heading strong {
    font-size: 18px;
  }

  .chemstructure-loading-heading span {
    margin-top: 3px;
    color: #66777b;
  }

  .chemstructure-loading-result {
    display: flex;
    gap: 18px;
    padding: 14px 0;
    border-top: 1px solid #edf1f2;
  }

  .chemstructure-loading-molecule,
  .chemstructure-loading-line {
    background: linear-gradient(90deg, #edf1f2 25%, #f8fafb 50%, #edf1f2 75%);
    background-size: 200% 100%;
    animation: chemstructure-loading-shimmer 1.4s ease-in-out infinite;
  }

  .chemstructure-loading-molecule {
    flex: 0 0 86px;
    height: 70px;
    border-radius: 5px;
  }

  .chemstructure-loading-copy {
    flex: 1;
    padding-top: 6px;
  }

  .chemstructure-loading-line {
    width: 100%;
    height: 10px;
    margin-bottom: 11px;
    border-radius: 10px;
  }

  .chemstructure-loading-line-title {
    width: 58%;
    height: 14px;
  }

  .chemstructure-loading-line-short {
    width: 76%;
  }

  @keyframes chemstructure-loading-shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  @keyframes chemstructure-loading-enter {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .chemstructure-search-loading,
    .chemstructure-loading-molecule,
    .chemstructure-loading-line {
      animation: none;
    }
  }

  @media (max-width: 768px) {
    .search-options-row {
      flex-direction: column;
      align-items: flex-start;
    }

    .structure-search-inline {
      margin-right: 0;
    }

    .chemstructure-search-mode {
      width: 100%;
    }

    .chemstructure-threshold-wrapper {
      max-width: 100%;
    }

    .chemstructure-threshold-slider {
      width: 100%;
    }

    .chemstructure-search-right {
      margin-left: auto;
      margin-right: auto;
    }

    .chemstructure-modal .modal-body {
      min-height: 560px;
    }

    .chemstructure-search-loading {
      padding: 22px 18px;
    }
  }
</style>
<script src="/chemstructure_search/structure_search.js"></script>
